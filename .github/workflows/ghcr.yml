name: Build and push GHCR images

on:
  push:
    branches: [main]
    paths:
      - 'apps/cms/**'
      - 'apps/web/**'
      - '.github/workflows/ghcr.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: cms
            context: ./apps/cms
            image_suffix: snippets-cms
          - app: web
            context: ./apps/web
            image_suffix: snippets-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name and public URL build-args
        id: meta
        run: |
          OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/${OWNER_LC}/${REPO_LC}/${{ matrix.image_suffix }}" >> "$GITHUB_OUTPUT"

          SITE_URL='${{ vars.PUBLIC_SITE_URL }}'
          CMS_URL='${{ vars.PUBLIC_PAYLOAD_URL }}'
          if [ -z "$SITE_URL" ]; then SITE_URL='https://snippets.example.com'; fi
          if [ -z "$CMS_URL" ]; then CMS_URL='https://cms.snippets.example.com'; fi
          echo "public_site_url=$SITE_URL" >> "$GITHUB_OUTPUT"
          echo "public_payload_url=$CMS_URL" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          build-args: |
            PUBLIC_SITE_URL=${{ steps.meta.outputs.public_site_url }}
            PUBLIC_PAYLOAD_URL=${{ steps.meta.outputs.public_payload_url }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
